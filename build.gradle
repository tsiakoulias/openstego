import org.apache.tools.ant.filters.FixCrLfFilter
import org.apache.tools.ant.filters.ReplaceTokens
import org.apache.tools.ant.taskdefs.condition.Os

import java.text.SimpleDateFormat

plugins {
    id 'java'
    id 'jacoco'
    id 'nebula.deb' version '8.4.1'
    id 'nebula.rpm' version '8.4.1'
}

String projectName = 'OpenStego'
File distBaseDir = file("${buildDir}/${distsDirName}/package")
File distWinJpackageDir = file("${buildDir}/jpackage")
File distWinInputDir = file("${distWinJpackageDir}/input")
File distWinAppDir = file("${distWinJpackageDir}/${projectName}")
String currYear = new SimpleDateFormat('yyyy').format(new Date())
def filterTokens = [
        'app.name'    : projectName,
        'app.version' : project.version,
        'author.name' : project.author,
        'author.mail' : project.authorMail,
        'homepage.url': project.homepageUrl,
        'time.year'   : currYear
]
def resolveJavaTool = { toolName ->
    def executable = Os.isFamily(Os.FAMILY_WINDOWS) ? "${toolName}.exe" : toolName
    def javaHomes = [
            project.findProperty('jpackageHome'),
            System.getenv('JPACKAGE_HOME'),
            System.getenv('JAVA_HOME'),
            System.getProperty('java.home')
    ].findAll { it != null && it.toString().trim().length() > 0 }

    for (def javaHome : javaHomes) {
        def candidate = file("${javaHome}/bin/${executable}")
        if (candidate.exists()) {
            return candidate.absolutePath
        }
    }

    return executable
}
def jpackageCommand = resolveJavaTool('jpackage')
def winRuntimeModules = ['java.base', 'java.desktop', 'java.prefs', 'java.xml', 'jdk.charsets']

repositories {
    mavenCentral()
}

sourceSets {
    main {
        java {
            srcDir 'src/main/java'
        }
        resources {
            exclude 'com/openstego/desktop/resource/i18n/*_ja.properties'
        }
    }
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.0'
    testImplementation 'org.mockito:mockito-core:4.8.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:4.8.0'

    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.9.0'
}

compileJava {
    sourceCompatibility = '8'
    targetCompatibility = '8'
}

processResources {
    filesMatching('**/*.properties') {
        filter(ReplaceTokens, tokens: filterTokens)
    }
}

jar {
    archiveFileName = 'openstego.jar'
    manifest {
        attributes([
                'Name'                  : projectName,
                'Main-Class'            : 'com.openstego.desktop.OpenStego',
                'Implementation-Version': project.version,
                'Built-By'              : project.author
        ])
    }
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = false
        csv.required = false
        html.required = true
    }
}

jacocoTestCoverageVerification {
    dependsOn test
    violationRules {
        rule {
            limit {
                minimum = 0.9
            }
        }
    }
}

javadoc {
    title "${projectName} v${version}"
    exclude 'com/openstego/desktop/plugin/**'
    options.bottom "Copyright &copy; 2007-${currYear} ${author}. All Rights Reserved."
    options.links project.jdkDocsUrl
    options.addStringOption('Xdoclint:none', '-quiet')
}

tasks.register("run", JavaExec) {
    dependsOn jar
    classpath = files(tasks.jar)
}

tasks.register("distBase", Copy) {
    dependsOn jar
    destinationDir = distBaseDir

    from('.') {
        include 'LICENSE'
    }
    from('src/main/dist') {
        exclude '**/*.sh'
        filesNotMatching('**/*.ico') {
            filter(ReplaceTokens, tokens: filterTokens)
        }
    }
    from('src/main/dist') {
        include '**/*.sh'
        filter(ReplaceTokens, tokens: filterTokens)
        fileMode 0755
    }
    from(tasks.jar) {
        into 'lib'
    }
}

tasks.register("distBin", Zip) {
    dependsOn distBase
    from distBaseDir
    into project.name + '-' + project.version
}

tasks.register("distWinExe", Exec) {
    dependsOn jar

    onlyIf {
        Os.isFamily(Os.FAMILY_WINDOWS)
    }

    inputs.file(tasks.jar.archiveFile)
    inputs.file(file('src/main/dist/openstego.ico'))
    inputs.file(file('artifacts/openstego-cli.properties'))
    inputs.file(file('artifacts/README-win.txt'))
    inputs.file(file('LICENSE'))
    outputs.dir(distWinAppDir)

    doFirst {
        delete distWinInputDir, distWinAppDir

        copy {
            from(tasks.jar.archiveFile)
            into distWinInputDir
        }
    }

    commandLine jpackageCommand,
            '--type', 'app-image',
            '--dest', distWinJpackageDir.path,
            '--input', distWinInputDir.path,
            '--name', projectName,
            '--main-jar', 'openstego.jar',
            '--main-class', 'com.openstego.desktop.OpenStego',
            '--icon', file('src/main/dist/openstego.ico').path,
            '--app-version', project.version.toString(),
            '--vendor', project.author.toString(),
            '--description', 'Steganography utility to hide messages into cover files',
            '--copyright', "Copyright (c) 2007-${currYear} ${project.author}",
            '--java-options', '-Xmx1024m',
            '--add-modules', winRuntimeModules.join(','),
            '--add-launcher', "${projectName}CLI=${file('artifacts/openstego-cli.properties').path}"

    doLast {
        copy {
            from('LICENSE')
            into distWinAppDir
        }

        copy {
            from('artifacts/README-win.txt')
            into distWinAppDir
            rename('README-win.txt', 'README')
            filter(ReplaceTokens, tokens: filterTokens)
        }
    }
}

tasks.register("distWinPortable", Zip) {
    dependsOn distWinExe

    onlyIf {
        Os.isFamily(Os.FAMILY_WINDOWS)
    }

    archiveFileName = "${project.name}-${project.version}-portable.zip"
    from distWinAppDir
    into project.name + '-' + project.version
}

tasks.register("distWin", Exec) {
    dependsOn distWinExe

    onlyIf {
        Os.isFamily(Os.FAMILY_WINDOWS)
    }

    doFirst {
        copy {
            from 'artifacts/installer.iss'
            into "${buildDir}/generated"
            filter(ReplaceTokens, tokens: [
                    'AppName'    : projectName,
                    'AppVersion' : project.version,
                    'AuthorName' : project.author,
                    'HomepageUrl': project.homepageUrl,
                    'AppDir'     : distWinAppDir.path,
                    'DistDir'    : project.buildDir.path + '\\distributions'
            ])
        }
    }

    workingDir project.buildDir
    commandLine 'cmd', '/c', 'iscc', 'generated\\installer.iss', '/Q'
}

tasks.register("distDeb", Deb) {
    dependsOn distBase
    packageName = project.name
    summary = projectName
    release = 1
    packageGroup = 'utils'
    maintainer = "${author} (${authorMail})"
    url = project.homepageUrl
    requires('default-jre').or('java8-runtime')

    into '/usr/share'
    from(distBaseDir) {
        into project.name
        include 'lib/**'
    }
    from(distBaseDir) {
        into project.name
        include 'openstego.sh'
        rename('openstego.sh', 'openstego')
        filter(FixCrLfFilter, eol: FixCrLfFilter.CrLf.newInstance('lf'))
        fileMode 0755
    }
    from('artifacts') {
        into 'applications'
        include 'openstego.desktop'
        filter(FixCrLfFilter, eol: FixCrLfFilter.CrLf.newInstance('lf'))
        filter(ReplaceTokens, tokens: filterTokens)
    }
    from('artifacts') {
        into 'icons/hicolor/scalable/apps'
        include 'openstego.svg'
    }
    from(distBaseDir) {
        into 'doc/' + project.name
        include 'README'
    }
    from('artifacts') {
        into 'doc/' + project.name
        include 'copyright'
        filter(FixCrLfFilter, eol: FixCrLfFilter.CrLf.newInstance('lf'))
        filter(ReplaceTokens, tokens: filterTokens)
    }

    link('/usr/bin/openstego', '/usr/share/openstego/openstego')
}

tasks.register("distRpm", Rpm) {
    dependsOn distBase
    packageName = project.name
    summary = projectName
    release = 1
    packageGroup = 'utils'
    packager = "${author} (${authorMail})"
    url = project.homepageUrl
    user = 'root'
    license = 'GPLv2'
    buildHost = ''
    os = LINUX
    requires('java', '1.8', GREATER | EQUAL)

    into '/usr/share'
    from(distBaseDir) {
        into project.name
        include 'lib/**'
    }
    from(distBaseDir) {
        into project.name
        include 'openstego.sh'
        rename('openstego.sh', 'openstego')
        filter(FixCrLfFilter, eol: FixCrLfFilter.CrLf.newInstance('lf'))
        fileMode 0755
    }
    from('artifacts') {
        into 'applications'
        addParentDirs false
        include 'openstego.desktop'
        filter(FixCrLfFilter, eol: FixCrLfFilter.CrLf.newInstance('lf'))
        filter(ReplaceTokens, tokens: filterTokens)
    }
    from('artifacts') {
        into 'icons/hicolor/scalable/apps'
        addParentDirs false
        include 'openstego.svg'
    }
    from(distBaseDir) {
        into 'doc/' + project.name
        addParentDirs false
        include 'LICENSE'
        include 'README'
        filter(FixCrLfFilter, eol: FixCrLfFilter.CrLf.newInstance('lf'))
    }

    link('/usr/bin/openstego', '/usr/share/openstego/openstego')
}

tasks.register("dist") {
    dependsOn distBin, distWinPortable, distWin, distDeb, distRpm
}
